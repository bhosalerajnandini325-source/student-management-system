<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Student Management System</title><link rel="stylesheet" href="style.css"></head>
<body><main class="container"><h1>Student Management System</h1><p class="sub">Add, search, edit and delete student records.</p>
<section class="card"><form id="studentForm"><input id="name" placeholder="Student name" required><input id="course" placeholder="Course" required><input id="email" type="email" placeholder="Email" required><button>Add Student</button></form></section>
<section class="card"><input id="search" class="search" placeholder="Search students..."><div class="table-wrap"><table><thead><tr><th>Name</th><th>Course</th><th>Email</th><th>Action</th></tr></thead><tbody id="studentList"></tbody></table></div></section></main><script src="script.js"></script></body></html>
